  /* ============================= Admin functions ============================= */

  function renderAdminSessions() {
    if (App.userRole !== 'master') return;
    
    google.script.run.withSuccessHandler(function(result) {
      if (result.error) {
        document.getElementById('admin-sessions-list').innerHTML = '<div class="empty-day">Error al cargar sesiones</div>';
        return;
      }
      
      var sessions = result.sessions || {};
      var container = document.getElementById('admin-sessions-list');
      var sessionIds = Object.keys(sessions);
      
      if (sessionIds.length === 0) {
        container.innerHTML = '<div class="empty-day">No hay sesiones activas</div>';
        return;
      }
      
      var html = '';
      sessionIds.forEach(function(sessionId) {
        var session = sessions[sessionId];
        var timeAgo = getTimeAgo(session.timestamp);
        var isCurrentUser = session.current === true;
        
        html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">';
        html += '<div>';
        html += '<div style="font-weight:500">' + escapeHtml(session.nombre || sessionId) + '</div>';
        html += '<div style="font-size:12px;color:var(--text-muted)">' + session.rol + ' · ' + timeAgo + '</div>';
        html += '</div>';
        
        if (!isCurrentUser) {
          html += '<button class="icon-btn" onclick="forceLogoutUser(\'' + sessionId + '\')" title="Cerrar sesión">';
          html += '<i data-lucide="log-out"></i>';
          html += '</button>';
        } else {
          html += '<span style="font-size:12px;color:var(--text-muted)">Tú</span>';
        }
        
        html += '</div>';
      });
      
      container.innerHTML = html;
      refreshIcons();
    }).getActiveSessions();
  }

  function getTimeAgo(timestamp) {
    if (!timestamp) return 'Desconocido';
    
    var now = new Date().getTime();
    var diff = now - timestamp;
    var minutes = Math.floor(diff / 60000);
    var hours = Math.floor(diff / 3600000);
    var days = Math.floor(diff / 86400000);
    
    if (minutes < 1) return 'Ahora mismo';
    if (minutes < 60) return 'Hace ' + minutes + ' min';
    if (hours < 24) return 'Hace ' + hours + ' h';
    return 'Hace ' + days + ' días';
  }

  function forceLogoutUser(sessionId) {
    if (!confirm('¿Cerrar la sesión de este usuario?')) return;
    
    google.script.run.withSuccessHandler(function(result) {
      if (result.ok) {
        renderAdminSessions();
        showToast('Sesión cerrada');
      } else {
        showToast('Error al cerrar sesión');
      }
    }).forceLogout(sessionId);
  }

  function runSearch(query) {
    var box = document.getElementById('search-results');
    var q = (query || '').trim().toLowerCase();
    if (!q) { box.innerHTML = '<div class="search-empty">Escribí para buscar en tu viaje.</div>'; return; }

    var results = (App.data.eventos || []).filter(function (ev) {
      return [ev.Titulo, ev.Subtitulo, ev.Destino, ev.Detalle].join(' ').toLowerCase().indexOf(q) !== -1;
    });

    if (!results.length) { box.innerHTML = '<div class="search-empty">Sin resultados para "' + escapeHtml(query) + '".</div>'; return; }

    box.innerHTML = results.map(function (ev) {
      var iconName = ICONS[ev.Tipo] || 'map-pin';
      return '<div class="search-result-item" data-fecha="' + escapeHtml(ev.Fecha) + '">' +
        '<div class="event-icon" style="width:32px;height:32px">' + icon(iconName, 14) + '</div>' +
        '<div><div class="sr-title">' + escapeHtml(ev.Titulo) + '</div>' +
        '<div class="sr-sub">' + escapeHtml(ev.Fecha) + ' · ' + escapeHtml(ev.Hora || '') + ' · ' + escapeHtml(ev.Destino || '') + '</div></div>' +
      '</div>';
    }).join('');

    box.querySelectorAll('[data-fecha]').forEach(function (el) {
      el.addEventListener('click', function () {
        var fecha = el.getAttribute('data-fecha');
        var idx = App.days.findIndex(function (d) { return d.date === fecha; });
        if (idx !== -1) { App.dayIndex = idx; closeSearch(); setView('day'); }
      });
    });
    refreshIcons();
  }

  function openAddOverlay() {
    document.getElementById('add-overlay').classList.remove('hidden');
    document.getElementById('add-status').style.display = 'none';
    populateDestinoSelects();
    // Reset to lugar tab
    switchAddTab('lugar');
    refreshIcons();
  }
  function closeAddOverlay() { document.getElementById('add-overlay').classList.add('hidden'); }

  function switchAddTab(tab) {
    var btns = document.querySelectorAll('#add-overlay [data-add-tab]');
    btns.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-add-tab') === tab); });
    document.getElementById('form-lugar').style.display = tab === 'lugar' ? 'flex' : 'none';
    document.getElementById('form-evento').style.display = tab === 'evento' ? 'flex' : 'none';
    document.getElementById('add-status').style.display = 'none';
  }

  function populateDestinoSelects() {
    var destinos = uniqueDestinoNames();
    var opts = '<option value="">Seleccionar…</option>' + destinos.map(function (d) {
      return '<option value="' + escapeHtml(d) + '">' + escapeHtml(d) + '</option>';
    }).join('');
    var selLugar = document.getElementById('lugar-destino-select');
    var selEvento = document.getElementById('evento-destino-select');
    var selEdit = document.getElementById('edit-destino-select');
    if (selLugar) selLugar.innerHTML = opts;
    if (selEvento) selEvento.innerHTML = opts;
    if (selEdit) selEdit.innerHTML = opts;
  }

  function showAddStatus(msg, isError) {
    var el = document.getElementById('add-status');
    el.textContent = msg;
    el.style.display = 'block';
    el.style.color = isError ? '#dc2626' : 'var(--accent)';
  }

  function handleAddLugar(e) {
    e.preventDefault();
    var form = document.getElementById('form-lugar');
    var data = {
      Nombre: form.Nombre.value.trim(),
      Categoria: form.Categoria.value,
      Destino: form.Destino.value,
      MapsURL: form.MapsURL.value.trim(),
      Notas: form.Notas.value.trim()
    };
    if (!data.Nombre || !data.Categoria) {
      showAddStatus('Completá nombre y categoría', true);
      return;
    }
    var btn = document.getElementById('btn-save-lugar');
    btn.disabled = true; btn.textContent = 'Guardando…';
    google.script.run.withSuccessHandler(function (result) {
      btn.disabled = false; btn.textContent = 'Guardar lugar';
      if (result.ok) {
        showAddStatus('Lugar guardado ✓');
        form.reset();
        google.script.run.withSuccessHandler(function (d) { onDataLoaded(d); }).getAppData();
      } else {
        showAddStatus(result.error || 'Error al guardar', true);
      }
    }).withFailureHandler(function (err) {
      btn.disabled = false; btn.textContent = 'Guardar lugar';
      showAddStatus('Error: ' + (err.message || err), true);
    }).agregarLugar(data);
  }

  function handleAddEvento(e) {
    e.preventDefault();
    var form = document.getElementById('form-evento');
    var fileInput = document.getElementById('voucher-file');
    var data = {
      Fecha: form.Fecha.value,
      Hora: form.Hora.value,
      'Hora Fin': form['Hora Fin'].value,
      Tipo: form.Tipo.value,
      Titulo: form.Titulo.value.trim(),
      Subtitulo: form.Subtitulo.value.trim(),
      Destino: form.Destino.value,
      Detalle: form.Detalle.value.trim(),
      CodigoConfirmacion: form.CodigoConfirmacion.value.trim(),
      MapsURL: form.MapsURL.value.trim(),
      Telefono: form.Telefono.value.trim(),
      'Zona Horaria': form['Zona Horaria'].value.trim(),
      VoucherURL: form.VoucherURL.value.trim()
    };
    if (!data.Fecha || !data.Hora || !data.Tipo || !data.Titulo) {
      showAddStatus('Completá fecha, hora, tipo y título', true);
      return;
    }
    var btn = document.getElementById('btn-save-evento');
    btn.disabled = true; btn.textContent = 'Guardando…';

    function doSave(fileBase64, fileMime, fileName) {
      google.script.run.withSuccessHandler(function (result) {
        btn.disabled = false; btn.textContent = 'Guardar evento';
        if (result.ok) {
          showAddStatus('Evento guardado ✓');
          form.reset();
          document.getElementById('voucher-file-name').style.display = 'none';
          if (fileInput) fileInput.value = '';
          google.script.run.withSuccessHandler(function (d) { onDataLoaded(d); }).getAppData();
        } else {
          showAddStatus(result.error || 'Error al guardar', true);
        }
      }).withFailureHandler(function (err) {
        btn.disabled = false; btn.textContent = 'Guardar evento';
        showAddStatus('Error: ' + (err.message || err), true);
      }).agregarEvento(data, fileBase64 || null, fileMime || null, fileName || null);
    }

    if (fileInput && fileInput.files && fileInput.files.length > 0) {
      var file = fileInput.files[0];
      var reader = new FileReader();
      reader.onload = function (ev) {
        var base64 = ev.target.result.split(',')[1];
        doSave(base64, file.type, file.name);
      };
      reader.readAsDataURL(file);
    } else {
      doSave();
    }
  }

  /* ============================= Edit overlay ============================= */

  function openEditOverlay(ev) {
    var overlay = document.getElementById('edit-overlay');
    overlay.classList.remove('hidden');
    document.getElementById('edit-status').style.display = 'none';
    document.getElementById('edit-voucher-file-name').style.display = 'none';
    document.getElementById('edit-voucher-current').style.display = 'none';
    document.getElementById('edit-voucher-file').value = '';
    populateDestinoSelects();

    var form = document.getElementById('form-edit');
    form._idx.value = ev._editIdx || '';
    form.Fecha.value = ev.Fecha || '';
    form.Hora.value = ev.Hora || '';
    form['Hora Fin'].value = ev['Hora Fin'] || '';
    form.Tipo.value = ev.Tipo || '';
    form.Titulo.value = ev.Titulo || '';
    form.Subtitulo.value = ev.Subtitulo || '';
    form.Destino.value = ev.Destino || '';
    form.Detalle.value = ev.Detalle || '';
    form.CodigoConfirmacion.value = ev.CodigoConfirmacion || '';
    form.MapsURL.value = ev.MapsURL || '';
    form.Telefono.value = ev.Telefono || '';
    form['Zona Horaria'].value = ev['Zona Horaria'] || 'Europe/Rome';
    form.VoucherURL.value = ev.VoucherURL || '';

    if (ev.VoucherURL) {
      var cur = document.getElementById('edit-voucher-current');
      cur.textContent = 'Voucher actual: ' + ev.VoucherURL;
      cur.style.display = 'block';
    }

    refreshIcons();
  }
  function closeEditOverlay() { document.getElementById('edit-overlay').classList.add('hidden'); }

  function handleEditEvento(e) {
    e.preventDefault();
    var form = document.getElementById('form-edit');
    var idx = form._idx.value;
    var eventos = App.data.eventos || [];
    var orig = eventos[Number(idx)];
    if (!orig) return;

    var data = {
      Fecha: form.Fecha.value,
      Hora: form.Hora.value,
      'Hora Fin': form['Hora Fin'].value,
      Tipo: form.Tipo.value,
      Titulo: form.Titulo.value.trim(),
      Subtitulo: form.Subtitulo.value.trim(),
      Destino: form.Destino.value,
      Detalle: form.Detalle.value.trim(),
      CodigoConfirmacion: form.CodigoConfirmacion.value.trim(),
      MapsURL: form.MapsURL.value.trim(),
      Telefono: form.Telefono.value.trim(),
      'Zona Horaria': form['Zona Horaria'].value,
      VoucherURL: form.VoucherURL.value.trim(),
      'Seguimiento Vuelo': orig['Seguimiento Vuelo'] || '',
      'Fecha Fin': orig['Fecha Fin'] || '',
      'Zona Horaria Fin': orig['Zona Horaria Fin'] || ''
    };
    if (!data.Fecha || !data.Hora || !data.Tipo || !data.Titulo) {
      showEditStatus('Completá fecha, hora, tipo y título', true);
      return;
    }
    var btn = document.getElementById('btn-save-edit');
    btn.disabled = true; btn.textContent = 'Guardando…';

    var fileInput = document.getElementById('edit-voucher-file');

    function doSave(fileBase64, fileMime, fileName) {
      google.script.run.withSuccessHandler(function (result) {
        btn.disabled = false; btn.textContent = 'Guardar cambios';
        if (result.ok) {
          showEditStatus('Evento actualizado ✓');
          google.script.run.withSuccessHandler(function (d) { onDataLoaded(d); }).getAppData();
        } else {
          showEditStatus(result.error || 'Error al guardar', true);
        }
      }).withFailureHandler(function (err) {
        btn.disabled = false; btn.textContent = 'Guardar cambios';
        showEditStatus('Error: ' + (err.message || err), true);
      }).actualizarEvento(Number(form._idx.value), data, fileBase64 || null, fileMime || null, fileName || null);
    }

    if (fileInput && fileInput.files && fileInput.files.length > 0) {
      var file = fileInput.files[0];
      var reader = new FileReader();
      reader.onload = function (ev) {
        var base64 = ev.target.result.split(',')[1];
        doSave(base64, file.type, file.name);
      };
      reader.readAsDataURL(file);
    } else {
      doSave();
    }
  }

  function showEditStatus(msg, isError) {
    var el = document.getElementById('edit-status');
    el.textContent = msg;
    el.style.display = 'block';
    el.style.color = isError ? '#dc2626' : 'var(--accent)';
  }

  function copyToClipboard(text) {
    var done = function () { showToast('Copiado: ' + text); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { /* no-op */ }
    document.body.removeChild(ta);
  }

  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.add('hidden'); }, 1800);
  }

})();
</script>
